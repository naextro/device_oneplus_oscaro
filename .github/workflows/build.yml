name: Build Project Infinity X for oscaro

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (userdebug or user)'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - user

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses6 libncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 bc libssl-dev rsync libarchive-tools ccache
          
          # Install repo tool
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo

          # Git identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Initialize Project Infinity X Source
        run: |
          mkdir -p ~/work/rom
          cd ~/work/rom
          repo init -u https://github.com/ProjectInfinity-X/manifest.git -b 16 --depth=1 --git-lfs
          
          # Pull naextro local manifest
          mkdir -p .repo/local_manifests
          curl -s https://raw.githubusercontent.com/naextro/device_oneplus_oscaro/16.0/local_manifest.xml -o .repo/local_manifests/oscaro.xml

      - name: Sync Source
        run: |
          cd ~/work/rom
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

      - name: Kernel Setup (KSU-Next)
        run: |
          cd ~/work/rom/kernel/oneplus/sm6375 || exit 0
          git submodule init
          git submodule update
          bash setup* || true

      - name: Build ROM
        run: |
          cd ~/work/rom
          export CCACHE_DIR=~/.ccache
          export USE_CCACHE=1
          ccache -M 50G
          source build/envsetup.sh
          lunch infinity_oscaro-${{ github.event.inputs.build_type }}
          m bacon -j$(nproc --all)

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InfinityX-oscaro
          path: ~/work/rom/out/target/product/oscaro/InfinityX-*.zip
          if-no-files-found: warn
